<!doctype html>
<html lang="bg">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#080808">
  <meta name="description" content="GalIsia Nails Studio — Варна. Маникюр, красота и внимание към всеки детайл.">
  <title>GalIsia Nails Studio</title>
  <style>
    :root {
      --bg: #070707;
      --surface: #0e0e0f;
      --surface-2: #141416;
      --gold: #e7a565;
      --gold-light: #f2c18e;
      --text: #f7f3ee;
      --muted: #aaa29a;
      --line: rgba(231,165,101,.20);
      --shadow: 0 24px 70px rgba(0,0,0,.48);
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at 50% -12%, rgba(231,165,101,.13), transparent 34%),
        linear-gradient(180deg, #111 0%, #070707 44%, #050505 100%);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    a { -webkit-tap-highlight-color: transparent; }

    .shell {
      width: min(100%, 680px);
      margin: 0 auto;
      min-height: 100vh;
      padding: 22px 18px 44px;
    }

    .card {
      position: relative;
      overflow: hidden;
      background: linear-gradient(180deg, rgba(15,15,16,.98), rgba(8,8,9,.98));
      border: 1px solid rgba(255,255,255,.055);
      border-radius: 32px;
      box-shadow: var(--shadow);
    }

    .hero {
      padding: 30px 24px 22px;
      text-align: center;
    }

    .hero::before {
      content: "";
      position: absolute;
      width: 300px;
      height: 300px;
      top: -205px;
      left: 50%;
      transform: translateX(-50%);
      border-radius: 50%;
      background: rgba(231,165,101,.14);
      filter: blur(15px);
      pointer-events: none;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      margin: 2px 0 18px;
      color: var(--gold-light);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .23em;
      text-transform: uppercase;
    }

    .eyebrow::before,
    .eyebrow::after {
      content: "";
      width: 28px;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--gold));
      opacity: .75;
    }
    .eyebrow::after { transform: scaleX(-1); }

    .logo {
      width: 152px;
      height: 190px;
      object-fit: contain;
      display: block;
      margin: -2px auto 8px;
      filter: drop-shadow(0 10px 26px rgba(0,0,0,.35));
    }

    h1 {
      margin: 2px 0 6px;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(44px, 11vw, 66px);
      line-height: .98;
      font-weight: 400;
      letter-spacing: .08em;
      color: var(--gold-light);
    }

    .subtitle {
      margin: 16px auto 0;
      color: #ded7d0;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(18px, 4.7vw, 23px);
      font-style: italic;
      letter-spacing: .02em;
    }

    .divider {
      width: 52px;
      height: 1px;
      margin: 25px auto 0;
      background: linear-gradient(90deg, transparent, var(--gold), transparent);
    }

    .content {
      padding: 0 18px 20px;
    }

    .info-card {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 16px;
      margin: 0 0 14px;
      border: 1px solid var(--line);
      border-radius: 20px;
      background: linear-gradient(135deg, rgba(231,165,101,.075), rgba(255,255,255,.025));
    }

    .icon-box {
      flex: 0 0 46px;
      width: 46px;
      height: 46px;
      border-radius: 15px;
      display: grid;
      place-items: center;
      background: var(--gold);
      color: #090909;
      box-shadow: 0 10px 26px rgba(231,165,101,.13);
    }

    .icon-box svg { width: 22px; height: 22px; fill: currentColor; }

    .info-copy { min-width: 0; text-align: left; }
    .info-label {
      display: block;
      color: var(--muted);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .12em;
      text-transform: uppercase;
      margin-bottom: 5px;
    }
    .info-value {
      margin: 0;
      color: var(--text);
      font-size: 16px;
      line-height: 1.35;
      font-weight: 600;
    }

    .map-card {
      position: relative;
      height: 320px;
      overflow: hidden;
      border-radius: 24px;
      border: 1px solid rgba(255,255,255,.07);
      background: #e7e7e7;
      box-shadow: inset 0 0 0 1px rgba(0,0,0,.06);
    }

    .map-card iframe {
      width: 100%;
      height: 100%;
      border: 0;
      filter: grayscale(.16) saturate(.72) contrast(.96);
    }

    .map-card::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      box-shadow: inset 0 -80px 75px rgba(0,0,0,.25);
    }

    .map-action {
      position: absolute;
      z-index: 2;
      left: 16px;
      right: 16px;
      bottom: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      min-height: 58px;
      padding: 14px 18px;
      border-radius: 18px;
      background: linear-gradient(135deg, var(--gold-light), var(--gold));
      color: #090909;
      text-decoration: none;
      font-size: 16px;
      font-weight: 800;
      letter-spacing: .01em;
      box-shadow: 0 15px 38px rgba(0,0,0,.32);
      transition: transform .18s ease, filter .18s ease;
    }
    .map-action svg { width: 21px; height: 21px; fill: currentColor; }

    .section-title {
      margin: 26px 3px 13px;
      color: var(--muted);
      font-size: 11px;
      font-weight: 700;
      text-align: left;
      letter-spacing: .14em;
      text-transform: uppercase;
    }

    .social-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 11px;
    }

    .social {
      min-height: 67px;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 14px;
      color: var(--text);
      background: linear-gradient(145deg, rgba(255,255,255,.045), rgba(255,255,255,.018));
      border: 1px solid rgba(255,255,255,.075);
      border-radius: 19px;
      text-decoration: none;
      transition: transform .18s ease, border-color .18s ease, background .18s ease;
    }

    .social .social-icon {
      flex: 0 0 40px;
      width: 40px;
      height: 40px;
      border-radius: 13px;
      display: grid;
      place-items: center;
      background: rgba(231,165,101,.12);
      color: var(--gold-light);
      border: 1px solid rgba(231,165,101,.16);
    }
    .social svg { width: 21px; height: 21px; fill: currentColor; }
    .social-copy { min-width: 0; text-align: left; }
    .social-name { display: block; font-size: 14px; font-weight: 750; }
    .social-note { display: block; margin-top: 3px; color: var(--muted); font-size: 11px; }

    .call {
      margin-top: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      min-height: 62px;
      padding: 14px 20px;
      border-radius: 19px;
      text-decoration: none;
      background: linear-gradient(135deg, var(--gold-light), var(--gold));
      color: #090909;
      font-size: 16px;
      font-weight: 850;
      box-shadow: 0 14px 34px rgba(231,165,101,.12);
      transition: transform .18s ease, filter .18s ease;
    }
    .call svg { width: 20px; height: 20px; fill: currentColor; }

    .footer {
      margin: 22px 0 2px;
      color: #706a65;
      text-align: center;
      font-size: 11px;
      letter-spacing: .08em;
    }

    @media (hover:hover) {
      .map-action:hover, .call:hover { transform: translateY(-2px); filter: brightness(1.035); }
      .social:hover {
        transform: translateY(-2px);
        border-color: rgba(231,165,101,.30);
        background: rgba(231,165,101,.055);
      }
    }

    @media (max-width: 420px) {
      .shell { padding: 12px 10px 28px; }
      .card { border-radius: 27px; }
      .hero { padding: 24px 18px 18px; }
      .content { padding: 0 13px 15px; }
      .logo { width: 132px; height: 166px; }
      .map-card { height: 285px; }
      .social { padding: 10px; gap: 9px; }
      .social .social-icon { flex-basis: 36px; width: 36px; height: 36px; border-radius: 12px; }
      .social-note { display: none; }
    }

    @media (prefers-reduced-motion: reduce) {
      * { scroll-behavior: auto !important; transition: none !important; }
    }
  </style>
</head>
<body>

</html>
